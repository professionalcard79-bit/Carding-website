<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARDING — Card Details</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070707;
      color: #f5f5f5;
      line-height: 1.6;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      padding: 22px 0;
      border-bottom: 1px solid #292929;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d4af37;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .back {
      color: #d4af37;
      text-decoration: none;
      border: 1px solid #d4af37;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 55px 0 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .gold {
      color: #d4af37;
    }

    .hero p {
      color: #aaa;
      max-width: 650px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      padding: 25px 0 50px;
    }
