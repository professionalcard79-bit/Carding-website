<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CARDING — Application Status</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#111;
}

.box{
  width:92%;
  max-width:500px;
  margin:80px auto;
  background:white;
  padding:30px 22px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:25px;
}

.logo span{
  color:#d6b45b;
}

.loader{
  width:45px;
  height:45px;
  margin:20px auto;
  border:4px solid #ddd;
  border-top:4px solid #d6b45b;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

h1{
  font-size:23px;
}

p{
  color:#777;
  line-height:1.6;
}

.success{
  display:none;
}

.button{
  display:inline-block;
  margin-top:20px;
  padding:14px 22px;
  background:#d6b45b;
  color:#000;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

  <div class="logo">
    CARD<span>ING</span>
  </div>

  <div id="waiting">

    <div class="loader"></div>

    <h1>Application Submitted</h1>

    <p>
      Your application has been submitted successfully.
    </p>

    <p>
      Please wait while your application is being reviewed.
    </p>

  </div>


  <div id="success" class="success">

    <h1>Application Approved ✅</h1>

    <p>
      Your application has been approved.
    </p>

    <a
      class="button"
      href="card-store.html">
      GO TO CARD STORE
    </a>

  </div>

</div>

</body>
</html>
