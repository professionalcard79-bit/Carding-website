<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CARDING Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070707;
  color:#fff;
}

.container{
  width:92%;
  max-width:900px;
  margin:auto;
}

header{
  padding:22px 0;
  border-bottom:1px solid #222;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:6px;
}

.logo span{
  color:#d6b45b;
}

h1{
  margin-top:35px;
}

.box{
  background:#101010;
  border:1px solid #292929;
  border-radius:18px;
  padding:22px;
  margin:25px 0;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#080808;
  color:#fff;
  outline:none;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  margin:12px 8px 0 0;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-btn{
  width:100%;
  background:#d6b45b;
  color:#000;
}

.logout{
  background:#333;
  color:#fff;
}

.approve{
  background:#d6b45b;
  color:#000;
}

.reject{
  background:#8b2020;
  color:#fff;
}

.application{
  background:#101010;
  border:1px solid #292929;
  border-radius:18px;
  padding:22px;
  margin:20px 0;
}

.row{
  margin:9px 0;
}

.label{
  color:#999;
  font-size:13px;
}

.value{
  margin-top:3px;
  font-size:16px;
  word-break:break-word;
}

.status{
  display:inline-block;
  margin-top:15px;
  padding:8px 14px;
  border-radius:20px;
  background:#332b16;
  color:#d6b45b;
}

.empty{
  color:#999;
  margin-top:30px;
}

.error{
  color:#ff6b6b;
  margin-top:10px;
  word-break:break-word;
}

.success{
  color:#7ee787;
  margin-top:10px;
}

.hidden{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

</style>
</head>

<body>

<header>
<div class="container">
<div class="logo">CARD<span>ING</span> ADMIN</div>
</div>
</header>


<main class="container">


<!-- LOGIN BOX -->

<div id="loginBox" class="box">

<h1>Admin Login</h1>

<p style="color:#999">
Sign in with your authorized admin account.
</p>

<input
  type="email"
  id="email"
  placeholder="Admin Email"
  autocomplete="email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button
  class="login-btn"
  id="loginBtn"
  type="button">
  LOGIN
</button>

<p id="loginStatus" class="error"></p>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="hidden">

<div class="topbar">

<h1>Applications</h1>

<button
  class="logout"
  id="logoutBtn"
  type="button">
  LOGOUT
</button>

</div>

<div id="applications">
<p class="empty">Loading applications...</p>
</div>

</div>


</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8-pN9Jg4BXOH9dHsWyH_wHjjr_iXekox",

  authDomain:
  "carding-website-87a10.firebaseapp.com",

  projectId:
  "carding-website-87a10",

  storageBucket:
  "carding-website-87a10.firebasestorage.app",

  messagingSenderId:
  "105806699328",

  appId:
  "1:105806699328:web:cb43d3d46e42d256655"

};


/* INITIALIZE FIREBASE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginStatus =
document.getElementById("loginStatus");

const applicationsBox =
document.getElementById("applications");


/* ADMIN EMAIL */

const ADMIN_EMAIL =
"professionalcard79@gmail.com";


/* LOGIN */

loginBtn.addEventListener(
"click",
async function(){

  const email =
  document.getElementById("email")
  .value
  .trim();

  const password =
  document.getElementById("password")
  .value;


  loginStatus.textContent = "";


  if(!email || !password){

    loginStatus.textContent =
    "Please enter email and password.";

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
  "LOGGING IN...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    loginStatus.textContent = "";


  }catch(error){

    console.error(
      "Firebase Login Error:",
      error
    );


    /* SHOW EXACT ERROR */

    loginStatus.textContent =
    "Firebase Error: " +
    error.code;


  }


  loginBtn.disabled = false;

  loginBtn.textContent =
  "LOGIN";

});


/* AUTH STATE */

onAuthStateChanged(
auth,
async function(user){

  if(!user){

    loginBox.classList.remove(
      "hidden"
    );

    adminPanel.classList.add(
      "hidden"
    );

    return;
  }


  /* ADMIN EMAIL CHECK */

  if(
    user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await signOut(auth);

    loginStatus.textContent =
    "This account is not authorized.";

    return;
  }


  /* SHOW ADMIN */

  loginBox.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );


  loadApplications();

});


/* LOGOUT */

logoutBtn.addEventListener(
"click",
async function(){

  try{

    await signOut(auth);

  }catch(error){

    console.error(error);

  }

});


/* LOAD APPLICATIONS */

async function loadApplications(){

  applicationsBox.innerHTML =
  '<p class="empty">Loading applications...</p>';


  try{

    const snapshot =
    await getDocs(
      collection(
        db,
        "applications"
      )
    );


    if(snapshot.empty){

      applicationsBox.innerHTML =
      '<p class="empty">No applications found.</p>';

      return;
    }


    applicationsBox.innerHTML = "";


    const applications = [];


    snapshot.forEach(
    function(item){

      applications.push({

        id:item.id,

        data:item.data()

      });

    });


    /* SORT BY DATE */

    applications.sort(
    function(a,b){

      const aTime =
      a.data.createdAt?.seconds || 0;

      const bTime =
      b.data.createdAt?.seconds || 0;

      return bTime - aTime;

    });


    /* DISPLAY */

    applications.forEach(
    function(item){

      const data =
      item.data;


      const application =
      document.createElement(
        "div"
      );


      application.className =
      "application";


      const status =
      data.status ||
      "Pending";


      application.innerHTML = `

        <div class="row">

          <div class="label">
            Name
          </div>

          <div class="value">
            ${escapeHtml(
              data.name || ""
            )}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Email
          </div>

          <div class="value">
            ${escapeHtml(
              data.email || ""
            )}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Mobile
          </div>

          <div class="value">
            ${escapeHtml(
              data.mobile || ""
            )}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Card
          </div>

          <div class="value">
            ${escapeHtml(
              data.card || ""
            )}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Application ID
          </div>

          <div class="value">
            ${escapeHtml(
              item.id
            )}
          </div>

        </div>


        <div class="status">

          Status:
          ${escapeHtml(
            status
          )}

        </div>


        <br>


        <button
          class="approve"
          onclick="changeStatus(
            '${item.id}',
            'Approved'
          )">

          APPROVE

        </button>


        <button
          class="reject"
          onclick="changeStatus(
            '${item.id}',
            'Rejected'
          )">

          REJECT

        </button>

      `;


      applicationsBox.appendChild(
        application
      );

    });


  }catch(error){

    console.error(
      "Firestore Error:",
      error
    );


    applicationsBox.innerHTML = `

      <p class="error">

        Firestore Error:
        ${escapeHtml(
          error.code ||
          error.message
        )}

      </p>

    `;

  }

}


/* APPROVE / REJECT */

window.changeStatus =
async function(
  applicationId,
  newStatus
){

  try{

    await updateDoc(

      doc(
        db,
        "applications",
        applicationId
      ),

      {
        status:
        newStatus
      }

    );


    alert(
      "Application " +
      newStatus +
      " successfully."
    );


    loadApplications();


  }catch(error){

    console.error(
      "Update Error:",
      error
    );


    alert(
      "Update failed: " +
      error.code
    );

  }

};


/* HTML SECURITY */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
